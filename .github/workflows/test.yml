name: Bot tests

on:
  push:
    branches:
      - feature/telegram-citizen-card
  pull_request:
    paths:
      - 'citizenCard.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
