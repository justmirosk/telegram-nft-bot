name: Publisher checks
on:
  pull_request:
    paths:
      - 'publishingMcp.js'
      - 'publisher.js'
      - 'imageUploads.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publisher-checks.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check publishingMcp.js
      - run: npm test
